<!doctype html>
<html lang="en" data-edition="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>The shelf — swiss</title>
<meta name="description" content="Mockup: the Video Library's discipline applied to a library of books.">
<link rel="icon" href="../../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="shelf.css">
</head>

<body>
<a class="visually-hidden" href="#grid">Skip to the shelf</a>

<header class="bar">
  <div class="shell bar-row">
    <h1 class="bar-title">
      <a href="frontpage.html" data-i18n="shelfTitle">The Shelf</a>
      <span class="bar-count" id="count"></span>
    </h1>

    <div class="bar-spacer"></div>

    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14.5 14.5"></path>
      </svg>
      <label class="visually-hidden" for="q" data-i18n="searchLabel">Search by title or author</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="searchPlaceholder" placeholder="Title or author">
    </div>

    <label class="visually-hidden" for="arrange" data-i18n="arrangeLabel">Arrange</label>
    <select class="arrange" id="arrange">
      <option value="shelf" data-i18n="byShelf">Shelf status</option>
      <option value="subject" data-i18n="bySubject">Subject</option>
      <option value="author" data-i18n="byAuthor">Author</option>
      <option value="year" data-i18n="byYear">Year written</option>
      <option value="added" data-i18n="byAdded">Date added</option>
      <option value="rating" data-i18n="byRating">Rating</option>
    </select>

    <div class="bar-group" id="chips" role="group" data-i18n-aria="shelvesLabel" aria-label="Shelves"></div>

    <button class="icon-btn" id="edition" type="button" title="Light / dark" aria-label="Light or dark">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
        <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"></path>
      </svg>
    </button>
    <button class="icon-btn" id="lang" type="button" title="Dansk / English">EN</button>
  </div>
</header>

<main class="shell" id="grid">
  <div id="sections"></div>
  <p class="empty-note" id="empty" hidden data-i18n="nothing">Nothing on the shelf matches that.</p>
</main>

<div class="scrim" id="scrim" hidden></div>

<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-top">
    <span class="sheet-kind" id="sheet-kind"></span>
    <button class="icon-btn" id="sheet-close" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M4 4 12 12M12 4 4 12"></path>
      </svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<script src="data.js"></script>
<script src="shelf.js"></script>
</body>
</html>
