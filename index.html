<!doctype html>
<html lang="en" data-edition="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6efe4">
<meta name="color-scheme" content="light dark">
<title>My quote collection</title>
<meta name="description" content="Quotes on technology, philosophy, literature and ideas, collected by Alexander Bustrup.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:title" content="My quote collection">
<meta property="og:description" content="Quotes on technology, philosophy, literature and ideas.">

<script>
  /* Apply the saved edition before first paint so the page never flashes the
     default palette. Mirrors readEdition() in assets/app.js. */
  (function () {
    try {
      var editions = ['paper', 'night', 'folio', 'index'];
      var saved = localStorage.getItem('quotes-edition');
      if (editions.indexOf(saved) < 0) {
        saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'night'
          : 'paper';
      }
      document.documentElement.dataset.edition = saved;
      if (saved === 'night') {
        document.querySelector('meta[name=theme-color]').setAttribute('content', '#14110d');
      }
    } catch (e) {
      document.documentElement.dataset.edition = 'paper';
    }
  })();
</script>

<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/nav.css">
</head>

<body>
<a class="skip-link" href="#collection" data-i18n="index.skip">Skip to the quotes</a>

<header class="masthead masthead-solo shell">
  <h1 data-i18n="nav.brand">My quote collection</h1>
</header>

<div class="controls" id="controls">
  <div class="shell">
    <div class="controls-row">
      <div class="search">
        <label class="visually-hidden" for="search" data-i18n="index.search.label">Search the collection</label>
        <input id="search" type="search" placeholder="Search quotes, authors, works…" data-i18n-placeholder="index.search.placeholder" autocomplete="off" spellcheck="false">
        <span class="search-hint" aria-hidden="true">/</span>
      </div>

      <label class="visually-hidden" for="filter-subject" data-i18n="index.filter.subject.label">Filter by subject</label>
      <select class="pill" id="filter-subject"><option value="">All subjects</option></select>

      <button class="pill" id="toggle-favorites" type="button" aria-pressed="false">
        <span data-i18n="index.favourites">Favourites</span> <span class="pill-count" id="favorites-count"></span>
      </button>

      <!-- The shelf, Add and More. Built by assets/nav.js, so the same three
           controls sit in the same order on every page. They are in this row,
           which sticks, so the shelf is reachable while scrolled and not only
           from the top of the page. -->
      <div id="nav-actions"></div>
    </div>

    <div class="active-filters" id="active-filters" hidden></div>

    <!-- Only ever visible in curate mode. Removal is a batch operation on
         purpose: deleting Goodreads chaff one issue at a time is the kind of
         chore that does not get done. -->
    <div class="curate-bar" id="curate-bar" hidden>
      <span id="curate-count">Nothing selected</span>
      <button class="pill" id="curate-remove" type="button" disabled>Remove selected…</button>
      <button class="pill" id="curate-clear" type="button" disabled data-i18n="index.curate.deselect">Deselect</button>
      <span class="curate-hint" data-i18n="index.curate.hint">Tick the quotes to drop, then open one issue for all of them.</span>
      <!-- The Curate button is under More now, so leaving the mode is here, on
           the bar that says the mode is on. -->
      <button class="pill" id="curate-done" type="button" data-i18n="index.curate.done">Done</button>
    </div>
  </div>
</div>

<!-- What the More menu holds on this page: the filters that are not on the
     controls row, and the two ways of reading. assets/nav.js moves this into
     the panel, so every control keeps its id and app.js keeps its listeners. -->
<div id="more-extras" hidden>
  <div class="more-grid">
    <div class="more-field">
      <label class="more-label" for="filter-author" data-i18n="index.filter.author.label">Author</label>
      <select class="pill" id="filter-author"><option value="">All authors</option></select>
    </div>
    <div class="more-field">
      <label class="more-label" for="filter-work" data-i18n="index.filter.work.label">Work</label>
      <select class="pill" id="filter-work"><option value="">All works</option></select>
    </div>
    <div class="more-field">
      <label class="more-label" for="filter-era" data-i18n="index.filter.era.label">Era</label>
      <select class="pill" id="filter-era"><option value="">All eras</option></select>
    </div>
    <div class="more-field">
      <label class="more-label" for="sort" data-i18n="index.sort.label">Sort</label>
      <select class="pill" id="sort">
        <option value="added">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="author">By author</option>
        <option value="work">By work</option>
        <option value="year">By year written</option>
        <option value="length">Shortest first</option>
        <option value="random">Shuffle</option>
      </select>
    </div>
  </div>
  <div class="more-actions">
    <button class="pill" id="open-focus" type="button" data-more-close data-i18n-title="index.focus.title" title="Read one at a time (F)">
      <span data-i18n="ui.focus">Focus</span> <span class="pill-key" aria-hidden="true">F</span>
    </button>
    <button class="pill" id="toggle-curate" type="button" aria-pressed="false" data-more-close data-i18n-title="index.curate.title" title="Show edit and remove controls (C)">
      <span data-i18n="index.curate">Curate</span> <span class="pill-key" aria-hidden="true">C</span>
    </button>
  </div>
</div>

<main class="shell">
  <p class="result-summary" id="result-summary" role="status" aria-live="polite"></p>

  <ol class="collection" id="collection"></ol>

  <div class="empty" id="empty" hidden>
    <p><strong data-i18n="index.empty.title">Nothing here yet.</strong></p>
    <p id="empty-detail"></p>
  </div>
</main>

<footer class="page-footer">
  <div class="shell footer-row">
    <div>
      <p style="margin:0">
        <a href="works.html" data-i18n="nav.shelf">The shelf</a> ·
        <a href="scout.html" data-i18n="nav.board">The board</a> ·
        <a href="suggest.html" data-i18n="nav.next">What to read next</a> ·
        <a id="add-quote-link" href="https://github.com/abustrup/Quote-collection/issues/new?template=add-quote.yml" data-i18n="nav.add">Add a quote</a> ·
        <a href="import.html" data-i18n="nav.import">Import from Goodreads</a>
      </p>
      <p style="margin:.4rem 0 0" id="footer-keys"></p>
    </div>
    <div>
      <p style="margin:0" id="footer-stats"></p>
      <p style="margin:.4rem 0 0">
        <a href="https://github.com/abustrup/Quote-collection" data-i18n="index.footer.source">Source</a> ·
        <a href="https://abustrup.github.io/alexanders-brief/">Alexanders Brief</a>
      </p>
    </div>
  </div>
</footer>

<div class="focus" id="focus" hidden>
  <div class="focus-bar shell">
    <span class="focus-position" id="focus-position"></span>
    <div class="focus-bar-actions">
      <button class="pill focus-fav" id="focus-favorite" type="button" aria-pressed="false">
        <span class="focus-fav-label" data-i18n="ui.favourite">Favourite</span>
        <span class="focus-fav-key" aria-hidden="true">S</span>
      </button>
      <button class="pill" id="close-focus" type="button">
        <span data-i18n="ui.close">Close</span> <span class="focus-esc" aria-hidden="true">esc</span>
      </button>
    </div>
  </div>
  <div class="focus-stage">
    <figure class="focus-quote" id="focus-quote"></figure>
  </div>
  <div class="focus-nav">
    <button class="pill" id="focus-prev" type="button"><span aria-hidden="true">←</span> <span data-i18n="ui.previous">Previous</span></button>
    <button class="pill" id="focus-shuffle" type="button" data-i18n="ui.shuffle">Shuffle</button>
    <button class="pill" id="focus-next" type="button"><span data-i18n="ui.next">Next</span> <span aria-hidden="true">→</span></button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div class="shell" style="padding:2rem 0">
    <p>This collection is rendered in the browser, so it needs JavaScript enabled.
    The quotations themselves live in plain JSON at
    <a href="data/quotes.json">data/quotes.json</a> and can always be read directly.</p>
  </div>
</noscript>

<script type="module" src="assets/app.js"></script>
<script type="module" src="assets/add-quote.js"></script>
</body>
</html>
