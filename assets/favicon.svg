  <!--
    The tab icon [2026-11-24]: the opening quote mark of Playfair Display Bold,
    the face the masthead is set in, in the night edition's gold on its ink.
    Drawn as outlines, so no font has to load wherever a tab bar draws it.

    The two marks stand a little further apart than the typeface sets them, and
    their size and position were searched on the pixel grid, so that at 16 px
    they stay two clean shapes instead of one smudge. The PNG copy beside it and
    the Home Screen icon are drawn from SVG masters by scripts/draw-icons.mjs.
  -->
